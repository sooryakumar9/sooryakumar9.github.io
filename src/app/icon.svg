<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="8" fill="#08090b"/>
  <!--
    The letters are paths rather than a <text> node. A favicon renders outside
    the page, with no guarantee about which fonts are available to it, and a
    fallback face would change the mark itself. Drawn heavy because 16px in a
    crowded tab strip is the size that decides whether it reads at all.
  -->
  <!--
    Nudged: the two glyphs together span x 6.4 to 28.3 and y 8.5 to 20.9, so
    their own centre is up and to the right of the square's. Optically centring
    them matters more here than agreeing with the coordinate system.
  -->
